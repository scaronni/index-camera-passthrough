[package]
name = "index-camera-passthrough"
description = "Camera passthrough for Valve Index on Linux"
authors = ["Yuxuan Shui <yshuiv7@gmail.com>"]
repository = "https://github.com/scaronni/index-camera-passthrough"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[features]
default = ["openxr"]
openvr = ["dep:openvr-sys"]
openxr = ["dep:openxr"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
ash = "0.38.0"
# No window system integration is needed, the images are rendered into the
# swapchains of the VR runtime.
vulkano = { version = "0.35.2", default-features = false, features = ["macros"] }
vulkano-shaders = "0.35.0"
image = "0.25.10"
openvr-sys = { path = "openvr-sys", optional = true }
ctrlc = "3.5.2"
log = "0.4.34"
env_logger = "0.11.11"
v4l = "0.14.0"
udev = "0.9.3"
thiserror = "2.0.20"
renderdoc = "0.12.1"
nalgebra = "0.35.0"
itertools = "0.15.0"
config = "0.15.26"
serde = { version = "1.0.229", features = ["derive"] }
argh = "0.1.19"
serde_json = "1.0.151"
xdg = "3.0.0"
toml = "1.1.6"
humantime-serde = "1.1.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
libloading = "0.9.0"
cstr = "0.2.12"
openxr = { version = "0.22.0", optional = true }
smallvec = "1.16.1"
